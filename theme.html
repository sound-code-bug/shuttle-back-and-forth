<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>无闪屏圆形主题切换</title>

  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      transition: none;
    }

    body.light {
      background: #f5f5f5;
      color: #111;
    }

    body.dark {
      background: #0b0b0b;
      color: white;
    }

    .container {
      width: 100%;
      height: 100vh;

      display: flex;
      flex-direction: column;

      align-items: center;
      justify-content: center;

      gap: 30px;
    }

    h1 {
      font-size: 90px;
      user-select: none;
    }

    h2 {
      font-size: 120px;
    }

    button {
      padding: 14px 40px;
      border: none;
      border-radius: 14px;

      font-size: 18px;
      cursor: pointer;

      transition: .3s;
    }

    .light button {
      background: #111;
      color: white;
    }

    .dark button {
      background: white;
      color: #111;
    }

    /* 截图层 */

    .theme-layer {
      position: fixed;
      inset: 0;

      z-index: 9999;

      pointer-events: none;

      background-size: cover;
      background-position: center;

      will-change:
        clip-path,
        mask,
        -webkit-mask;
    }

    .toggle {
      border: 1px red solid;
      position: absolute;
      right: 10px;
      top: 10px;
      border-radius: 50%;
      width: 44px;
      height: 44px;
    }

    .card {
      width: 800px;
      height: 200px;

      border: 1px solid;

      transition:
        background-color .3s,
        border-color .3s;
    }

    /* 明亮 */

    body.light .card {
      background: #ffffff;
      border-color: #ff4d4f;
    }

    /* 黑暗 */

    body.dark .card {
      background: #1f1f1f;
      border-color: #444;
    }
  </style>
</head>

<body class="light">
  <div id="toggle" class="toggle"> 切换主题 </div>


  <div class="container">

    <h1 id="title">Hello World</h1>
    <h2>你好世界</h2>

    <div class="card"></div>

  </div>

</body>

<script src="./js/jquery-3.7.1.min.js"></script>
<script>

  let dark = false

  // ===============================
  // DOM 转 SVG 截图（无闪屏）
  // ===============================

  function createPageSnapshot() {

    const html =
      new XMLSerializer()
        .serializeToString(document.documentElement)

    const svg =
      `
      <svg xmlns="http://www.w3.org/2000/svg"
           width="${window.innerWidth}"
           height="${window.innerHeight}">
        <foreignObject
          width="100%"
          height="100%">
          ${html}
        </foreignObject>
      </svg>
      `

    return `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}`
  }

  // ===============================
  // jQuery 动画
  // ===============================

  function animateRadius(options) {

    const obj = {
      radius: options.from
    }

    $({ value: options.from }).animate({

      value: options.to

    }, {

      duration: options.duration,

      easing: "swing",

      step(value) {

        options.step(value)
      },

      complete() {

        options.complete?.()
      }
    })
  }

  // ===============================
  // 切换
  // ===============================

  $("#toggle").on("click", function () {

    // 右上角

    const x = window.innerWidth
    const y = 0

    const maxRadius = Math.hypot(
      window.innerWidth,
      window.innerHeight
    )

    // ===============================
    // 旧主题截图
    // ===============================

    const oldThemeImage =
      createPageSnapshot()

    // ===============================
    // 创建旧主题层
    // ===============================

    const oldLayer =
      $("<div class='theme-layer'></div>")

    oldLayer.css({

      backgroundImage:
        `url("${oldThemeImage}")`
    })

    $("body").append(oldLayer)

    // 强制渲染

    oldLayer[0].offsetHeight

    // ===============================
    // 真正切换主题
    // ===============================

    dark = !dark

    $("body")
      .toggleClass("dark", dark)
      .toggleClass("light", !dark)

    // ==================================================
    // 明亮 -> 黑暗
    //
    // 圆圈内：明亮
    // 圆圈外：黑暗
    // 圆圈缩小
    // ==================================================

    if (dark) {

      oldLayer.css({

        clipPath:
          `circle(${maxRadius}px at ${x}px ${y}px)`
      })

      oldLayer[0].offsetHeight

      animateRadius({

        from: maxRadius,

        to: 0,

        duration: 700,

        step(radius) {

          oldLayer.css({

            clipPath:
              `circle(${radius}px at ${x}px ${y}px)`
          })
        },

        complete() {

          oldLayer.remove()
        }
      })
    }

    // ==================================================
    // 黑暗 -> 明亮
    //
    // 圆圈外：黑暗
    // 圆圈内：明亮
    // 圆圈放大
    // ==================================================

    else {

      animateRadius({

        from: 0,

        to: maxRadius,

        duration: 700,

        step(radius) {

          const mask =
            `radial-gradient(
              circle at ${x}px ${y}px,
              transparent ${radius}px,
              black ${radius + 1}px
            )`

          oldLayer.css({

            mask: mask,

            webkitMask: mask
          })
        },

        complete() {

          oldLayer.remove()
        }
      })
    }

  })

</script>

</html>
